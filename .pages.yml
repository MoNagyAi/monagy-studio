                    type: string
                    list: true
                  - { name: emphasis, label: إبراز الصف, type: boolean, default: false }

      - name: lipSync
        label: مزامنة الشفاه AI Lip-Sync
        type: object
        fields:
          - { name: labelEn, label: اسم القسم - إنجليزي, type: string }
          - { name: labelAr, label: اسم القسم - عربي, type: string }
