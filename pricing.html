<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="MoNagy Studio AI video production pricing packages.">
  <title>MoNagy Studio — Pricing</title>
  <link rel="icon" type="image/png" href="assets/logo-mark.png">
  <link rel="stylesheet" href="pricing.css">
</head>
<body>
  <main class="pricing-page" id="pricingPage">
    <header class="pricing-topbar">
      <a class="pricing-brand" href="./"><img src="assets/logo-mark.png" alt="MoNagy Studio"><span>MoNagy Studio</span></a>
      <div class="language-switch" role="group" aria-label="Language switcher">
        <button type="button" data-lang="en" class="active">English</button>
        <button type="button" data-lang="ar">العربية</button>
      </div>
    </header>

    <section class="pricing-hero">
      <p class="pricing-eyebrow" id="pricingEyebrow">AI VIDEO PRODUCTION</p>
      <h1 id="pricingTitle">Compare packages</h1>
      <p class="pricing-note" id="pricingNote"></p>
    </section>

    <section class="pricing-table-section" aria-labelledby="pricingTitle">
      <div class="pricing-table-wrap">
        <table class="pricing-table" id="pricingTable"></table>
      </div>
    </section>

    <section class="pricing-faq-section" id="faqSection" aria-labelledby="faqTitle">
      <div class="pricing-faq-heading">
        <p class="pricing-eyebrow" id="faqEyebrow">FAQ</p>
        <h2 id="faqTitle">Frequently Asked Questions</h2>
        <p id="faqIntro"></p>
      </div>
      <div class="pricing-faq-list" id="faqList"></div>
    </section>

    <footer class="pricing-footer">
      <a href="./">← Back to portfolio</a>
      <span>MoNagy Studio</span>
    </footer>
  </main>
  <script src="pricing.js"></script>
</body>
</html>
